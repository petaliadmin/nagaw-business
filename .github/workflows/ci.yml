name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # The whole suite (end-to-end included) ran about 14 min in October 2026.
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database, not a secret.
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - name: Build, with decoy secrets that must not reach the browser
        run: pnpm build
        env:
          # Canary values, not secrets: scripts/check-client-bundle.mjs fails
          # if any of them appears in what the web app serves.
          API_PROTECTION_BYPASS: canary-api-protection-bypass-7f3a91
          SUPABASE_SERVICE_ROLE_KEY: canary-supabase-service-role-2c8e40
          SUPABASE_SECRET_KEY: canary-supabase-secret-key-9b1d72
          DATABASE_URL: postgres://canary:canary-db-password-5e6f13@db.invalid:5432/postgres
      - name: No privileged secret in the web bundle
        run: pnpm check:bundle
      - name: No known vulnerable dependency
        run: pnpm audit --prod --audit-level high
      - run: pnpm --filter @nagaw/web exec playwright install --with-deps chromium
      - run: pnpm --filter @nagaw/web test:e2e

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
